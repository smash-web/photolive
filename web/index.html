<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Живое Фото</title>

    <!-- PWA: иконка на экран "Домой" и установка как приложение -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#c83c23" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Живое Фото" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { background: #f7f5f0; }
    </style>

    <!--
      ВАЖНО: three и mind-ar подключены здесь через CDN (importmap),
      а НЕ через npm install. Причина: пакет mind-ar тянет зависимость
      "canvas" (нативные C++ биндинги для Node), которая не собирается
      на сервере Vercel — именно из-за этого был build error. Через
      importmap эти библиотеки грузятся прямо в браузере, Node/Vercel
      их вообще не видит при сборке.

      Версия three ЗАФИКСИРОВАНА на 0.137.0 (а не на самой новой) —
      mind-ar внутри использует устаревшее имя THREE.sRGBEncoding,
      которое более новые версии three.js (0.152+) удалили. С более
      новым three страница выдаст ошибку импорта в консоли браузера.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.137.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.137.0/examples/jsm/",
          "mind-ar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js",
          "mind-ar-image": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
